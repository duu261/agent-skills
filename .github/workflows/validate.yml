name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Validate skill against the Agent Skills spec
        run: uvx --from skills-ref==0.1.1 agentskills validate skills/production-ops-discipline
